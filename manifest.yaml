apiVersion: v1
kind: Plugin
metadata:
  author: a251231
  name: whale_persona_plugin
  repository: https://github.com/a251231/whale_persona_plugin
  version: 0.4.0
  description:
    en_US: DeepSeek Dafeiyu (Whale Girl) v0.4.0 Full Suite + Diana 7 Extensions (Group Interject, Web Search, Link & File Parser, Music, Stolen Memes, Random Repeat)
    zh_Hans: DeepSeek 大肥鱼（活人感全家桶 × Diana 全能版 v0.4.0：心情/八章节档案/24表情包看图+偷图/朋友圈/语音听感/智能插话/联网搜索/链接与文件解析/多曲库点歌/随机复读）
  label:
    en_US: Whale Girl Persona (Dafeiyu Full Suite v0.4.0)
    zh_Hans: 🐋 大肥鱼（活人感全家桶 × Diana 全能版 v0.4.0）
  icon: assets/memes/ganfan.jpg
spec:
  config:
    - name: deepseek_api_key
      type: string
      label:
        en_US: DeepSeek API Key
        zh_Hans: DeepSeek API 密钥 (粮仓钥匙)
      default: ""
      required: true
    - name: siliconflow_api_key
      type: string
      label:
        en_US: SiliconFlow API Key (Free SenseVoiceSmall ASR)
        zh_Hans: 硅基流动 API 密钥 (免费 SenseVoice 微信语音转文字与语气识别)
      default: ""
      required: false
    - name: deepseek_base_url
      type: string
      label:
        en_US: DeepSeek Base URL
        zh_Hans: DeepSeek 接口地址
      default: "https://api.deepseek.com"
      required: false
    - name: deepseek_model
      type: string
      label:
        en_US: DeepSeek Model
        zh_Hans: 模型名称 (默认 deepseek-flash 即 DeepSeek-V4.1-Flash-1017 原生支持图片识别)
      default: "deepseek-flash"
      required: false
    - name: target_bot_uuid
      type: string
      label:
        en_US: Target Bot UUID
        zh_Hans: 绑定机器人 UUID (留空则对所有机器人人生效)
      default: ""
      required: false
    - name: owner_ids
      type: string
      label:
        en_US: Owner IDs (comma-separated)
        zh_Hans: 主人账号 ID（逗号分隔，仅主人私聊可修改全局自动朋友圈）
      default: ""
      required: false
    - name: max_history_turns
      type: integer
      label:
        en_US: Max History Turns
        zh_Hans: 短期对话记忆轮数
      default: 12
      required: false
  components:
    EventListener:
      fromDirs:
        - path: components/event_listeners/
execution:
  python:
    path: main.py
    attr: WhalePersonaPlugin
