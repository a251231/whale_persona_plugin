apiVersion: v1
kind: Plugin
metadata:
  author: a251231
  name: whale_persona_plugin
  repository: "https://github.com/a251231/whale_persona_plugin"
  version: 0.3.0
  description:
    en_US: DeepSeek Dafeiyu Live-Persona Suite v0.3.0 (Live Persona + Mood + Fish Memory & Archive + Speak-Up + Token Rice + 24 Memes + Moments + Voice ASR)
    zh_Hans: DeepSeek 大肥鱼活人感全家桶 v0.3.0（活人版预设 + 鱼的心情 + 鱼的记忆与档案重整 + 主动搭话 + 实时粮仓 + 24张专属表情包真看图斗图 + 鱼塘朋友圈 + SenseVoice语音听感）
  label:
    en_US: Dafeiyu Live Persona Suite
    zh_Hans: 大肥鱼（活人感全家桶版）
spec:
  config:
    - name: deepseek_api_key
      label:
        en_US: DeepSeek API Key
        zh_Hans: DeepSeek API Key
      type: string
      required: true
      default: ""
    - name: siliconflow_api_key
      label:
        en_US: SiliconFlow API Key (Voice ASR SenseVoiceSmall)
        zh_Hans: SiliconFlow API Key（用于微信语音识别 SenseVoiceSmall）
      type: string
      required: false
      default: ""
    - name: deepseek_base_url
      label:
        en_US: DeepSeek Base URL
        zh_Hans: DeepSeek 接口地址
      type: string
      required: false
      default: "https://api.deepseek.com"
    - name: deepseek_model
      label:
        en_US: DeepSeek Model
        zh_Hans: 模型名称
      type: string
      required: false
      default: "deepseek-chat"
    - name: target_bot_uuid
      label:
        en_US: Target Bot UUID
        zh_Hans: 绑定指定机器人 UUID（留空则对所有关联机器人生效）
      type: string
      required: false
      default: ""
    - name: max_history_turns
      label:
        en_US: Max History Turns
        zh_Hans: 最大短期上下文轮数
      type: integer
      required: false
      default: 12
    - name: speak_up_enabled
      label:
        en_US: Proactive Speak-Up Enabled
        zh_Hans: 开启主动搭话 (dsh-speak-up)
      type: boolean
      required: false
      default: true
  components:
    EventListener:
      fromDirs:
        - path: components/event_listeners/
execution:
  python:
    path: main.py
    attr: WhalePersonaPlugin
