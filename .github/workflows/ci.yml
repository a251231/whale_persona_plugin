name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    name: Unit Tests & .lbpkg Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and LangBot Plugin SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt langbot-plugin pyyaml

      - name: Check Python syntax & bytecode compilation
        run: python -m compileall -q main.py components tests

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Verify .lbpkg package build
        run: |
          lbp build
          ls -lh dist/*.lbpkg
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import yaml

          manifest = yaml.safe_load(Path("manifest.yaml").read_text(encoding="utf-8"))
          meta = manifest["metadata"]
          expected = Path("dist") / f"{meta['author']}-{meta['name']}-{meta['version']}.lbpkg"
          assert expected.is_file() and expected.stat().st_size > 100_000, f"Invalid package: {expected}"
          with zipfile.ZipFile(expected, "r") as zf:
              names = set(zf.namelist())
              for req in ("manifest.yaml", "main.py", "requirements.txt", "README.md"):
                  assert req in names, f"Missing {req} in {expected}"
          print(f"Verified package: {expected} ({expected.stat().st_size} bytes, {len(names)} entries)")
          PY
