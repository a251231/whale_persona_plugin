name: Release

on:
  push:
    branches:
      - main
    paths:
      - "manifest.yaml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish_to_market:
        description: "Sync to LangBot Space Marketplace (requires LANGBOT_SPACE_TOKEN secret)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build .lbpkg & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and LangBot Plugin CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt langbot-plugin pyyaml

      - name: Read metadata from manifest.yaml
        id: meta
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("manifest.yaml").read_text(encoding="utf-8"))
          meta = manifest["metadata"]
          author = str(meta["author"]).strip()
          name = str(meta["name"]).strip()
          version = str(meta["version"]).strip()
          tag = f"v{version}"
          pkg_name = f"{author}-{name}-{version}.lbpkg"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"author={author}\n")
              fh.write(f"name={name}\n")
              fh.write(f"version={version}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"pkg_name={pkg_name}\n")
          print(f"Resolved package: {pkg_name} (tag: {tag})")
          PY

      - name: Check whether GitHub Release ${{ steps.meta.outputs.tag }} already exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release ${TAG} already exists; skipping duplicate creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run syntax check & unit test suite
        run: |
          python -m compileall -q main.py components tests
          git diff --check
          python -m unittest discover -s tests -v

      - name: Build .lbpkg package & SHA256SUMS.txt
        if: steps.check_release.outputs.exists == 'false'
        env:
          PKG_NAME: ${{ steps.meta.outputs.pkg_name }}
        run: |
          lbp build
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          expected = Path("dist") / os.environ["PKG_NAME"]
          assert expected.is_file(), f"Missing package: {expected}"

          repacked = expected.with_suffix(".lbpkg.repack")
          skip_prefixes = ("tests/", ".github/", "dist/", ".git/", "__pycache__/")
          skip_files = {"AGENTS.md"}
          with zipfile.ZipFile(expected, "r") as zin, zipfile.ZipFile(
              repacked, "w", compression=zipfile.ZIP_DEFLATED
          ) as zout:
              for info in zin.infolist():
                  norm = info.filename.replace("\\", "/").removeprefix("./")
                  if not norm or norm.endswith("/"):
                      continue
                  if (
                      norm.startswith(skip_prefixes)
                      or norm in skip_files
                      or "/__pycache__/" in f"/{norm}"
                      or norm.endswith((".tmp", ".pyc", ".pyo"))
                  ):
                      continue
                  data = zin.read(info.filename)
                  info.filename = norm
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(info, data)
          repacked.replace(expected)

          assert expected.is_file() and expected.stat().st_size > 100_000, f"Invalid package: {expected}"
          with zipfile.ZipFile(expected, "r") as zf:
              names = {n.replace("\\", "/").removeprefix("./") for n in zf.namelist()}

          for req in ("manifest.yaml", "main.py", "requirements.txt", "README.md", "readme/README_zh_Hans.md"):
              assert req in names, f"Missing {req} in {expected}"
          assert any(n.startswith("assets/") for n in names), f"Missing assets/ in {expected}"
          for py_file in Path("components").rglob("*.py"):
              if "__pycache__" in py_file.parts:
                  continue
              rel = py_file.as_posix()
              assert rel in names, f"Missing {rel} in {expected}"
          for forbidden in ("tests/", ".github/", "dist/"):
              assert not any(n.startswith(forbidden) for n in names), f"Unexpected {forbidden} in {expected}"
          assert "AGENTS.md" not in names, f"Unexpected AGENTS.md in {expected}"
          assert not any(n.endswith(".tmp") for n in names), f"Unexpected *.tmp in {expected}"
          print(f"Repacked & verified package: {expected} ({expected.stat().st_size} bytes, {len(names)} entries)")
          PY
          test -s "dist/${PKG_NAME}"
          (
            cd dist
            sha256sum "${PKG_NAME}" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt
          ls -lh "dist/${PKG_NAME}" dist/SHA256SUMS.txt

      - name: Upload .lbpkg build artifact
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.pkg_name }}
          path: |
            dist/${{ steps.meta.outputs.pkg_name }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release ${{ steps.meta.outputs.tag }}
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PKG_NAME: ${{ steps.meta.outputs.pkg_name }}
        run: |
          export CHECKSUM_LINE="$(cat dist/SHA256SUMS.txt)"
          export GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body 2>/dev/null || true)"

          python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          pkg_name = os.environ["PKG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          checksum_line = os.environ["CHECKSUM_LINE"].strip()
          generated_notes = os.environ.get("GENERATED_NOTES", "").strip()

          template = textwrap.dedent("""\
              ## 📦 安装方式（三选一）

              1. **LangBot 插件市场一键安装（推荐）**：打开 LangBot 管理面板 → **插件** → **插件市场**，搜索 `大肥鱼` 或 `whale_persona_plugin` 安装。
              2. **离线包 `.lbpkg` 安装**：下载下方 Assets 中的 **`{pkg_name}`**，在 LangBot 管理面板 → **插件** → **从本地文件安装** 上传即可。
              3. **GitHub 仓库导入**：在 LangBot 插件安装页填入仓库地址 `https://github.com/{repo}`。

              ### 🔐 制品校验 (SHA-256)
              ```text
              {checksum_line}
              ```
              """)
          body = template.format(
              pkg_name=pkg_name,
              repo=repo,
              checksum_line=checksum_line,
          )
          if generated_notes:
              body = f"{body}\n---\n\n{generated_notes}\n"
          Path("dist/RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          PY

          gh release create "${TAG}" \
            "dist/${PKG_NAME}" \
            "dist/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "🐋 Whale Persona Plugin ${TAG}" \
            --notes-file dist/RELEASE_NOTES.md

      - name: Sync to LangBot Space Marketplace (optional)
        if: >-
          (steps.check_release.outputs.exists == 'false' && github.event_name != 'workflow_dispatch') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_to_market == true)
        env:
          LANGBOT_SPACE_TOKEN: ${{ secrets.LANGBOT_SPACE_TOKEN }}
        run: |
          if [ -z "${LANGBOT_SPACE_TOKEN:-}" ]; then
            echo "LANGBOT_SPACE_TOKEN secret is not configured; skipping LangBot Space Marketplace publish."
            exit 0
          fi
          lbp login --token "${LANGBOT_SPACE_TOKEN}"
          lbp publish
